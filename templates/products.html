<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<a href="/">Home</a> |
<a href="/login/">Login</a> |
<a href="/dashboard/">Dashboard</a> |
<a href="/about/">About</a> |
<a href="/contact/">Contact</a> |
<a href="/products/">Products</a> |
<a href="/add-product/">Add Product</a>

<h2>Product List</h2>

<table border="1" cellpadding="10">

<tr>
    <th>Name</th>
    <th>Price</th>
    <th>Description</th>
    <th>Image</th>
    <th>Status</th>
</tr>

{% for p in products %}

<tr>

<td>{{ p.name }}</td>
<td>{{ p.price }}</td>
<td>{{ p.description }}</td>

<td>

{% if p.image %}
<img src="{{ p.image.url }}" width="100">
{% endif %}

</td>

<td>{{ p.status }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
