{% extends 'masterpage.html' %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="container">

    <h1 align="center">Add Product</h1>
<form method="POST" enctype="multipart/form-data" onsubmit="return confirmSave()"></form>
 

        {% csrf_token %}

        <label>Product Name</label>

        <input type="text"
               name="name"
               required>

        <br><br>

        <label>Price</label>

        <input type="number"
               name="price"
               step="0.01"
               required>

        <br><br>

        <label>Description</label>

        <textarea
            name="description"
            rows="5"
            required></textarea>

        <br><br>

        <label>Image</label>

        <input type="file"
               name="image">

        <br><br>

        <label>Status</label>

        <select name="status">

            <option value="Available">
                Available
            </option>

            <option value="Out of Stock">
                Out of Stock
            </option>

        </select>

        <br><br>

        <button type="submit">

            Save Product

        </button>

    </form>

</div>

{% endblock %}
