{% extends 'masterpage.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container">

    <h1 align="center">

        Login

    </h1>

    <form method="POST">
        {% csrf_token %}

        {% if error %}
            <div class="form-error" style="color: red; margin-bottom: 1rem;">
                {{ error }}
            </div>
        {% endif %}

        <label>Username</label>

        <input type="text"
               name="username"
               placeholder="Enter Username"
               value="{{ username }}"
               required>

        <br><br>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <br><br>

        <button type="submit">

            Login

        </button>

    </form>

</div>

{% endblock %}
