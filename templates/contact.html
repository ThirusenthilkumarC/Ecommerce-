{% extends 'masterpage.html' %}

{% block title %}
Contact
{% endblock %}

{% block content %}

<div class="container">

    <h1>Contact Us</h1>

    <form>

        <label>Name</label>

        <input
            type="text"
            placeholder="Enter your name">

        <label>Email</label>

        <input
            type="email"
            placeholder="Enter your email">

        <label>Subject</label>

        <input
            type="text"
            placeholder="Enter subject">

        <label>Message</label>

        <textarea
            rows="6"
            placeholder="Enter your message"></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</div>

{% endblock %}
